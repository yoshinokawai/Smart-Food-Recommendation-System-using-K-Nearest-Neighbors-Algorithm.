{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card card-premium card-premium-primary shadow-lg border-0">
            <div class="card-header card-header-premium text-center py-4">
                <h3 class="mb-1 fw-bold text-gradient-primary">📋 Khảo Sát Sở Thích Đầu Vào</h3>
                <p class="text-muted mb-0 small">Hệ thống xử lý bài toán Khởi Động Lạnh (Cold Start) dành cho người dùng mới</p>
            </div>
            <div class="card-body p-4">
                <form action="/survey" method="POST">
                    
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-white mb-2">1. Bạn có thích ăn cay không?</label>
                        <select name="is_spicy" class="form-select form-select-premium" required>
                            <option value="0">Không cay</option>
                            <option value="1">Có, mình rất thích ăn cay 🌶️</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-white mb-2">2. Chế độ ăn uống hiện tại của bạn?</label>
                        <select name="is_vegan" class="form-select form-select-premium" required>
                            <option value="0" selected>Ăn mặn (Bình thường) 🍖</option>
                            <option value="1">Ăn chay (Vegan) 🥬</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-white mb-2">3. Bạn có chuộng đồ ăn ngọt không?</label>
                        <select name="is_sweet" class="form-select form-select-premium" required>
                            <option value="0">Không chuộng lắm</option>
                            <option value="1">Có thích đồ ngọt 🍬</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-white mb-2">4. Mức giá bạn ưu tiên tìm kiếm?</label>
                        <select name="price_range" class="form-select form-select-premium" required>
                            <option value="1">Rẻ (Bình dân) 💲</option>
                            <option value="2" selected>Vừa phải (Hợp lý) 💲💲</option>
                            <option value="3">Đắt (Cao cấp) 💲💲💲</option>
                        </select>
                    </div>
                    
                    <div class="mb-5">
                        <label class="form-label fw-semibold text-white mb-2">5. Phong cách ẩm thực vùng miền ưa thích?</label>
                        <select name="region_code" class="form-select form-select-premium" required>
                            <option value="1">Đặc sản Miền Bắc 🔴</option>
                            <option value="2">Đặc sản Miền Trung 🟡</option>
                            <option value="3">Đặc sản Miền Nam 🟢</option>
                            <option value="0" selected>Đồ ăn Quốc tế / Khác 🌐</option>
                        </select>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-premium btn-premium-success btn-lg fw-bold">Tìm Món Ngay (KNN Search) 🚀</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

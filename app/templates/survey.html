{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-success text-white text-center py-3">
                <h4 class="mb-0 fw-bold">Khảo sát Sở thích Đầu vào</h4>
                <small>Hệ thống xử lý Cold Start dành cho Người Dùng Mới</small>
            </div>
            <div class="card-body p-4">
                <form action="/survey" method="POST">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">1. Bạn có thích ăn cay không?</label>
                        <select name="is_spicy" class="form-select" required>
                            <option value="0">Không cay</option>
                            <option value="1">Có, mình thích ăn cay</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">2. Chế độ ăn của bạn là gì?</label>
                        <select name="is_vegan" class="form-select" required>
                            <option value="0" selected>Ăn mặn (Bình thường)</option>
                            <option value="1">Ăn chay</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">3. Bạn có chuộng đồ ăn ngọt?</label>
                        <select name="is_sweet" class="form-select" required>
                            <option value="0">Không chuộng lắm</option>
                            <option value="1">Có thích đồ ngọt</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">4. Mức giá bạn ưu tiên tìm kiếm?</label>
                        <select name="price_range" class="form-select" required>
                            <option value="1">Rẻ (Bình dân)</option>
                            <option value="2" selected>Vừa phải (Hợp lý)</option>
                            <option value="3">Đắt (Cao cấp)</option>
                        </select>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">5. Bạn muốn ăn món thuộc phong cách vùng miền nào?</label>
                        <select name="region_code" class="form-select" required>
                            <option value="1">Đặc sản Miền Bắc</option>
                            <option value="2">Đặc sản Miền Trung</option>
                            <option value="3">Đặc sản Miền Nam</option>
                            <option value="0" selected>Đồ ăn Quốc tế / Khác</option>
                        </select>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success btn-lg fw-bold">Tìm Món Ngay (KNN Search)</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
